<!DOCTYPE html>
<html>
<head>
<link rel="icon" href="sunglasses.jpg" type="image/jpeg">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>
 function big(x) {
  x.style.height = "300px";
  x.style.width = "440px";
 }

 function normal(x) {
  x.style.height = "150px";
  x.style.width = "220px";
 }

 function backgroundPurple(x) {
  x.style.backgroundColor = "purple";
 }

 function backgroundGreen(x) {
  x.style.backgroundColor = "green";
 }
</script>
</head>
<body topmargin="20" leftmargin="50">

<table border="3" width="500" height="500" align="center" bgcolor="silver">
<caption>My First Web Table<br><br></caption>
<tr>
 <th>header one</th>
 <th>header two</th>
 <th>header three</th>
 <th>header four</th>
</tr>

<tr>
 <td onclick="big(this)">data row1-col1</td>
 <td onmouseover="big(this)" onmouseout="normal(this)">data row1-col2</td>
 <td ondblclick="big(this)" onclick="normal(this)">data row1-col3</td>
 <td onclick="backgroundGreen(this)" ondblclick="backgroundPurple(this)">data row1-col4</td>
</tr>

<tr>
 <td>data row2-col1</td>
 <td>data row2-col2</td>
 <td>data row2-col3</td>
 <td>data row2-col4</td>
</tr>

</table>

</body>
</html>

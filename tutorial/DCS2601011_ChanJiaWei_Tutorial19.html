<!DOCTYPE HTML>
<html>
<head>
<title>Tutorial 19</title>

<link rel=icon href=sunglasses.jpg type=image/jpg>
<meta name=viewport content=width=device-width, initial-scale=1.0>
</head>
<body topmargin="50">
<style>
    .fname{
        background-color: darkblue;
        color: azure;
    }
    .lname{
        background-color: darkblue;
        color: azure;
    }
    .gender{
        background-color: darkblue;
        color: azure;
    }
    .fav_sub{
        background-color: darkblue;
        color: azure;
    }
    .address{
        background-color: darkblue;
        color: azure;
    }
    .dob{
        background-color: darkblue;
        color: azure;
    }
    .loginpass{
        background-color: darkblue;
        color: azure;
    }
    .course{
        background-color: darkblue;
        color: azure;
    }
</style>
<center>
<h1>Personal details:</h1>
<form>
<table cellpadding="8" style="background-color: powderblue; color: #696969; font-family: Verdana; width: 60%;">
<tr>
  <td class="fname"><label for="fname">First Name:</label></td>
  <td><input type="text" id="fname" name="fname" size="40" maxlength="5"></td>
</tr>
<tr>
  <td class="lname"><label for="lname">Last Name:</label></td>
  <td><input type="text" id="lname" name="lname"></td>
</tr>
<tr>
  <td class="gender">Gender:</td>
  <td>
  <label><input type="radio" name="gender" value="Male"> Male</label>
  <label><input type="radio" name="gender" value="Female"> Female</label>
  </td>
</tr>
<tr>
  <td class="course"><label for="course">Course:</label></td>
  <td>
   <select id="course" name="course" onchange="updateSubjects()">
   <option value="0">- List of Courses -</option>
   <option value="DIB">Diploma in Business</option>
   <option value="DCS">Diploma in Computer Science</option>
   <option value="DAS">Diploma in Airline Services</option>
 </select>
 </td>
</tr>
<tr>
  <td class="fav_sub">Subjects:</td>
  <td id="subjectCell">
  <span style="color:#888;">Select a course to see subjects</span>
  </td>
</tr>
<tr>
  <td class="address"><label for="address">Address:</label></td>
  <td><textarea id="address" rows="4" cols="30" name="address"></textarea></td>
</tr>
<tr>
  <td class="dob"><label for="dob">Date of Birth:</label></td>
  <td><input type="date" id="dob" name="dob"></td>
</tr>
<tr>
  <td class="loginpass"><label for="loginpass">Login password:</label></td>
  <td><input type="password" id="loginpass" name="loginpass"></td>
</tr>
</table>
<br><br>
  <input type="submit" value="Submit">
  <input type="reset" value="Reset">
</form>
</center>
<script>
var subjectsByCourse = {
  "DIB": ["MPU2333", "DIC2003", "DIB2333", "ECO1401", "LAW1501"],
  "DCS": ["MPU2333", "DCS3003", "MST1003", "MST2003"],
  "DAS": ["AVS2101", "AVS2201", "AVS2301", "CAB2401", "SAF2501"]
};

function updateSubjects() {
  var course = document.getElementById("course").value;
  var subjects = subjectsByCourse[course];
  var cell = document.getElementById("subjectCell");

  if (!subjects) {
    cell.innerHTML = '<span style="color:#888;">Please select a course</span>';
    return;
  }

  var html = "";
  for (var i = 0; i < subjects.length; i++) {
    html += '<label><input type="checkbox" name="fav_sub" value="'
          + subjects[i] + '"> ' + subjects[i] + '</label>\n';
  }
  cell.innerHTML = html;
}
</script>
</body>
</html>

<p style="text-align-last:right;">

</p>

<!--9.text-justify, 10.font-variant-->
<p style="font-variant:inherit;text-justify:auto">
CSS is used along with HTML and JavaScript in most websites
to createe user interfaces for web applications and user interfaces for many mobile applications.
</p>
